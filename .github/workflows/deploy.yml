# Deploy the Shiny app to shinyapps.io whenever main changes.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SHINYAPPS_TOKEN   token from shinyapps.io > Account > Tokens
#   SHINYAPPS_SECRET  secret paired with that token

name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-shinyapps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SHINYAPPS_ACCOUNT: huchaoran
      SHINYAPPS_APP_NAME: pdf_plot
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages
        run: |
          install.packages(c("rsconnect", "shiny", "bslib", "ggplot2", "plotly", "mvtnorm"))
        shell: Rscript {0}

      - name: Deploy
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          rsconnect::setAccountInfo(
            name   = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token  = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          rsconnect::deployApp(
            appDir      = ".",
            appName     = Sys.getenv("SHINYAPPS_APP_NAME"),
            account     = Sys.getenv("SHINYAPPS_ACCOUNT"),
            server      = "shinyapps.io",
            forceUpdate = TRUE
          )
        shell: Rscript {0}
